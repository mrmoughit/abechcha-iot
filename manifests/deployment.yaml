apiVersion: apps/v1
kind: Deployment
metadata:
  name: abechcha-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abechcha-playground
  template:
    metadata:
      labels:
        app: abechcha-playground
    spec:
      containers:
      - name: playground
        image: moughit1337a/iot-app:v2
        ports:
        - containerPort: 80